name: Dayo
options:
  bundleIdPrefix: com.kowwwwji
  # 日本語のアプリとして出す。en のままだと OS が英語の書式（日付など）とメニューを使い、App Store の言語欄も英語になる
  developmentLanguage: ja
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DayoCore:
    path: Packages/DayoCore

targets:
  Dayo:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - App
    dependencies:
      - package: DayoCore
    info:
      path: App/Info.plist
      properties:
        NSCalendarsFullAccessUsageDescription: 予定をタイムラインに表示・登録するためにカレンダーへのアクセスが必要です。
        NSRemindersFullAccessUsageDescription: Todo をタイムラインに表示・登録するためにリマインダーへのアクセスが必要です。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # 標準の暗号（HTTPS など OS の機能）しか使わない申告。無いと App Store Connect で提出のたびに聞かれる
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [ja]
        UILaunchScreen: {}
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        PRODUCT_BUNDLE_IDENTIFIER: com.kowwwwji.Dayo
        CODE_SIGN_STYLE: Automatic
        # Mac は App Sandbox 下で EventKit を使うため entitlements が必須。署名 ID が無くてもアドホックで動かす。
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Dayo.entitlements
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        # iPhone 実機へは無料の Apple ID（Personal Team）で署名して入れる（scripts/install-iphone.sh）。
        # Mac 向けには効かせない（Mac は上のアドホック署名と、App Store 向けの Release の DEVELOPMENT_TEAM が受け持つ）
        DEVELOPMENT_TEAM[sdk=iphoneos*]: 85Z44QYZL3
      configs:
        Debug:
          # 開発用のビルドは、インストールしたアプリと設定・許可を分ける（確認用の起動が普段使いの設定を書き換えないように）
          PRODUCT_BUNDLE_IDENTIFIER: com.kowwwwji.Dayo.dev
        Release:
          # App Store 向けの署名に使うチーム。普段の Release ビルド（scripts/install.sh）は上のアドホック署名のまま作り、
          # Apple の証明書での署名は scripts/archive.sh が上書きして行う（証明書の無い Mac でも install.sh が動くように）
          DEVELOPMENT_TEAM: ""
          ENABLE_HARDENED_RUNTIME: YES

schemes:
  Dayo:
    build:
      targets:
        Dayo: all
    run:
      config: Debug
